<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="Co-funded by the European Union">
  <rect width="180" height="120" fill="#003399" rx="4"/>
  <!-- 12 European Stars -->
  <g fill="#FFCC00" transform="translate(90, 60)">
    <g id="star">
      <polygon points="0,-42 2.6,-34 10.7,-34 4.1,-29 6.7,-21 0,-26 -6.7,-21 -4.1,-29 -10.7,-34 -2.6,-34" transform="scale(0.85)"/>
    </g>
    <use href="#star" transform="rotate(30)"/>
    <use href="#star" transform="rotate(60)"/>
    <use href="#star" transform="rotate(90)"/>
    <use href="#star" transform="rotate(120)"/>
    <use href="#star" transform="rotate(150)"/>
    <use href="#star" transform="rotate(180)"/>
    <use href="#star" transform="rotate(210)"/>
    <use href="#star" transform="rotate(240)"/>
    <use href="#star" transform="rotate(270)"/>
    <use href="#star" transform="rotate(300)"/>
    <use href="#star" transform="rotate(330)"/>
  </g>
  <text x="200" y="52" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.5">Co-funded by the</text>
  <text x="200" y="76" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">European Union</text>
</svg>
