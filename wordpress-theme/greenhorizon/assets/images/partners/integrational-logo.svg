<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-label="Integrational e.V. Logo">
  <defs>
    <linearGradient id="int-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23C9AB"/>
      <stop offset="100%" stop-color="#123C2F"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="240" height="80" rx="12" fill="rgba(18,60,47,0.3)" stroke="rgba(35,201,171,0.2)" stroke-width="1"/>
  <!-- Geometric Icon -->
  <g transform="translate(16, 16)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="#23C9AB" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="24" cy="24" r="14" fill="#123C2F" stroke="#B7FF4A" stroke-width="1.5"/>
    <path d="M 16,24 Q 24,14 32,24 Q 24,34 16,24 Z" fill="#23C9AB" opacity="0.8"/>
    <circle cx="24" cy="24" r="4" fill="#B7FF4A"/>
  </g>
  <!-- Partner Name -->
  <g transform="translate(74, 26)">
    <text x="0" y="14" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">Integrational e.V.</text>
    <text x="0" y="30" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">GERMANY // COORDINATOR</text>
  </g>
</svg>
