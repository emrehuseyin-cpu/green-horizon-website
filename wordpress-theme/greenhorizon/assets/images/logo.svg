<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Green Horizon Logo">
  <defs>
    <linearGradient id="gh-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7FF4A" />
      <stop offset="100%" stop-color="#23C9AB" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Drone / Horizon Tech Emblem -->
  <g transform="translate(10, 6)">
    <!-- Tech boundary diamond -->
    <rect x="6" y="6" width="40" height="40" rx="8" fill="rgba(18,60,47,0.7)" stroke="#23C9AB" stroke-width="1.5" stroke-dasharray="2 3"/>
    
    <!-- Drone Quadcopter crosshair lines -->
    <line x1="26" y1="2" x2="26" y2="50" stroke="#B7FF4A" stroke-width="1.5" opacity="0.6"/>
    <line x1="2" y1="26" x2="50" y2="26" stroke="#B7FF4A" stroke-width="1.5" opacity="0.6"/>

    <!-- 4 Drone Rotors -->
    <circle cx="12" cy="12" r="5" fill="none" stroke="url(#gh-glow)" stroke-width="2"/>
    <circle cx="40" cy="12" r="5" fill="none" stroke="url(#gh-glow)" stroke-width="2"/>
    <circle cx="12" cy="40" r="5" fill="none" stroke="url(#gh-glow)" stroke-width="2"/>
    <circle cx="40" cy="40" r="5" fill="none" stroke="url(#gh-glow)" stroke-width="2"/>

    <!-- Center Sensor / Camera Lens -->
    <circle cx="26" cy="26" r="6" fill="#123C2F" stroke="#B7FF4A" stroke-width="2"/>
    <circle cx="26" cy="26" r="2.5" fill="#B7FF4A"/>

    <!-- Subtle HUD Target Brackets -->
    <path d="M 18,20 L 20,18" stroke="#B7FF4A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 34,20 L 32,18" stroke="#B7FF4A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 18,32 L 20,34" stroke="#B7FF4A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 34,32 L 32,34" stroke="#B7FF4A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(72, 10)">
    <text x="0" y="24" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" letter-spacing="1.5">GREEN <tspan fill="#B7FF4A">HORIZON</tspan></text>
    <text x="0" y="40" fill="#23C9AB" font-family="'Space Grotesk', 'Inter', -apple-system, monospace" font-size="9" font-weight="600" letter-spacing="2.2">YOUTH VOICES // CLIMATE ACTION</text>
  </g>
</svg>
