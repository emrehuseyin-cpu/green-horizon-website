backend:
  name: git-gateway
  branch: main

# Where uploaded images will be saved and linked
media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

# Display settings
site_url: "https://greenhorizonyou.eu"
display_url: "https://greenhorizonyou.eu"
logo_url: "https://greenhorizonyou.eu/assets/images/logo-greenhorizon-emblem.png"

collections:
  # =========================================================================
  # 1. CORE PAGES CONTENT
  # =========================================================================
  - name: "pages"
    label: "Pages Content"
    delete: false
    files:
      # HOMEPAGE
      - name: "home"
        label: "Homepage"
        file: "assets/data/content/home.json"
        format: "json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Flags Text", name: "flags_text", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Booklet Button Label", name: "cta_booklet_label", widget: "string" }
              - { label: "VR Button Label", name: "cta_vr_label", widget: "string" }
              - { label: "Gallery Button Label", name: "cta_gallery_label", widget: "string" }
              - { label: "Activities Button Label", name: "cta_activities_label", widget: "string" }
          - label: "Promotional Video Section"
            name: "promo_video"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Video Title", name: "title", widget: "string" }
              - { label: "Video Description", name: "description", widget: "text" }
              - { label: "Poster Image", name: "poster", widget: "image" }
          - label: "Key Results Section"
            name: "results_section"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Result 1: Educational Booklet"
                name: "result_1"
                widget: "object"
                fields:
                  - { label: "Badge", name: "badge", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Meta", name: "meta", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Result 2: Short Climate Campaigns"
                name: "result_2"
                widget: "object"
                fields:
                  - { label: "Badge", name: "badge", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Meta", name: "meta", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Result 3: VR Photo Exhibition"
                name: "result_3"
                widget: "object"
                fields:
                  - { label: "Badge", name: "badge", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Meta", name: "meta", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

      # ABOUT PAGE
      - name: "about"
        label: "About Page"
        file: "assets/data/content/about.json"
        format: "json"
        fields:
          - label: "Header"
            name: "header"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Project Context"
            name: "context"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Context Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Horizontal Priorities Section"
            name: "priorities_section"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Priorities List"
                name: "priorities"
                widget: "list"
                fields:
                  - { label: "Badge", name: "badge", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Objectives Section"
            name: "objectives_section"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Objectives (1 to 6)"
                name: "objectives"
                widget: "list"
                fields:
                  - { label: "Number", name: "number", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

      # RESULTS & RESOURCES PAGE
      - name: "results"
        label: "Results & Resources"
        file: "assets/data/content/results.json"
        format: "json"
        fields:
          - label: "Header"
            name: "header"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Result 1: Educational Booklet"
            name: "result_1_booklet"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "License", name: "license", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Result 2: Documentary Series"
            name: "result_2_documentaries"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Campaign Films"
                name: "films"
                widget: "list"
                fields:
                  - { label: "Country", name: "country", widget: "string" }
                  - { label: "Duration", name: "duration", widget: "string" }
                  - { label: "Film Title", name: "title", widget: "string" }
                  - { label: "Film Description", name: "description", widget: "text" }
                  - { label: "Video File", name: "video_src", widget: "string" }
                  - { label: "Poster Image", name: "poster", widget: "image" }
          - label: "Result 3: VR Exhibition"
            name: "result_3_exhibition"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "MetaSteps URL", name: "vr_embed_url", widget: "string" }

      # CONTACT DETAILS
      - name: "contact"
        label: "Contact Information"
        file: "assets/data/content/contact.json"
        format: "json"
        fields:
          - label: "Header"
            name: "header"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Partner Contact Cards"
            name: "partners"
            widget: "list"
            fields:
              - { label: "Role Badge", name: "badge", widget: "string" }
              - { label: "Organization Name", name: "name", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "OID Number", name: "oid", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Website", name: "website", widget: "string" }

      # GLOBAL SITE SETTINGS & FOOTER
      - name: "settings"
        label: "Site Settings & EU Disclaimer"
        file: "assets/data/content/site-settings.json"
        format: "json"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Project Code", name: "project_number", widget: "string" }
          - { label: "Project Period", name: "project_period", widget: "string" }
          - { label: "Grant Amount", name: "project_grant", widget: "string" }
          - { label: "Coordinator", name: "coordinator_name", widget: "string" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
          - { label: "Official EU Disclaimer", name: "eu_disclaimer", widget: "text" }
          - { label: "Copyright Notice", name: "copyright_text", widget: "text" }
          - label: "Social Media Links"
            name: "social_links"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "YouTube", name: "youtube", widget: "string" }
              - { label: "Facebook", name: "facebook", widget: "string" }

  # =========================================================================
  # 2. NEWS & ARTICLES
  # =========================================================================
  - name: "news_section"
    label: "News & Updates"
    delete: false
    files:
      - name: "news_file"
        label: "News Articles"
        file: "assets/data/content/news.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Full Text", name: "full_text", widget: "markdown" }
              - { label: "Featured Image", name: "image", widget: "image" }
              - { label: "Author", name: "author", widget: "string" }

  # =========================================================================
  # 3. ACTIVITIES & TIMELINE
  # =========================================================================
  - name: "activities_section"
    label: "Activities & Timeline"
    delete: false
    files:
      - name: "activities_file"
        label: "Activities & Timeline"
        file: "assets/data/content/activities.json"
        format: "json"
        fields:
          - label: "Milestones"
            name: "milestones"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string", required: false }
              - { label: "Location", name: "place", widget: "string" }
              - { label: "Participants", name: "participants", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link URL", name: "link", widget: "string", required: false }
              - { label: "Link Label", name: "linkLabel", widget: "string", required: false }

  # =========================================================================
  # 4. PROJECT PARTNERS
  # =========================================================================
  - name: "partners_section"
    label: "Project Partners"
    delete: false
    files:
      - name: "partners_file"
        label: "Project Partners"
        file: "assets/data/content/partners.json"
        format: "json"
        fields:
          - label: "Partners"
            name: "partners"
            widget: "list"
            fields:
              - { label: "Organization Name", name: "legalName", widget: "string" }
              - { label: "Acronym", name: "acronym", widget: "string" }
              - { label: "Country", name: "country", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Website", name: "website", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Responsibilities"
                name: "responsibilities"
                widget: "list"
                field: { label: "Task", name: "task", widget: "string" }
